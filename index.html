$('glitterTab').onclick=()=>{glitter=true;renderPalette()};
renderPalette();
document.querySelectorAll('.effect').forEach(btn=>btn.onclick=()=>{effect=btn.dataset.effect;document.querySelectorAll('.effect').forEach(b=>b.classList.toggle('active',b===btn))});

async function sharePainting(dataUrl,name='magic-coloring'){try{const response=await fetch(dataUrl),blob=await response.blob(),file=new File([blob],'magic-coloring.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return;console.warn('Share unavailable',e)}const a=document.createElement('a');a.href=dataUrl;a.download='magic-coloring.png';document.body.append(a);a.click();a.remove();alert('Billedet er klar. På iPad kan du bruge Del og vælge Gem billede 💖')}
$('download').onclick=async()=>{if(!editorReady||!activePaintingId||paintLocked){$('toast').textContent='⏳ Vent til maleriet er klar';return}await savePainting(true);};

let soundEnabled=localStorage.getItem('magicColoringSound')!=='off',audioContext=null,lastMagicSound=0;
function updateSoundButton(){$('soundToggle').textContent=soundEnabled?'🔔 Lyd til':'🔕 Lyd fra';$('soundToggle').setAttribute('aria-pressed',String(soundEnabled))}
updateSoundButton();
$('soundToggle').onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem('magicColoringSound',soundEnabled?'on':'off');updateSoundButton();if(soundEnabled)playMagicSound(false)};
function playMagicSound(celebrate=false){if(!soundEnabled)return;const now=performance.now();if(!celebrate&&now-lastMagicSound<130)return;lastMagicSound=now;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();if(audioContext.state==='suspended')audioContext.resume();const start=audioContext.currentTime;const notes=celebrate?[523.25,659.25,783.99,1046.5]:[880,1174.66,1396.91];notes.forEach((freq,i)=>{const t=start+i*(celebrate?.13:.065),osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(celebrate?.095:.085,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+(celebrate?.42:.30));osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+(celebrate?.43:.31))})}catch(e){console.warn('Sound unavailable',e)}}
function magicBurst(){const layer=document.createElement('div');layer.id='celebration';const icons=['✨','⭐','💖','🌈','💎','🌟'];for(let i=0;i<36;i++){const el=document.createElement('span');el.className='star';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=(Math.random()*96)+'%';el.style.animationDelay=(Math.random()*.65)+'s';el.style.animationDuration=(2+Math.random()*1.1)+'s';layer.append(el)}document.body.append(layer);setTimeout(()=>layer.remove(),4100)}
$('finishPainting').onclick=async()=>{if(!editorReady||paintLocked){$('toast').textContent='⏳ Vent til maleriet er klar';return}if(paintingSaved){saveRequested=true;await savePainting()}magicBurst();playMagicSound(true);const message=document.createElement('div');message.id='finishMessage';message.textContent='🌟 Hvor er det flot! 💖';document.getElementById('finishMessage')?.remove();document.body.append(message);setTimeout(()=>message.remove(),3200);$('toast').textContent=paintingSaved?'🏆 Flot! Dit gemte maleri er opdateret.':'🏆 Flot! Tryk på Gem maleri, hvis du vil beholde det.'};

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(document.body.classList.contains('editing')&&e.target.closest('#paper'))e.preventDefault()},{passive:false});
gallery();dbOpen().then(renderSaved).catch(e=>console.warn('Local storage unavailable',e));
