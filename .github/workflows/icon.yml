name: Update colorful iPad app icon
on:
  push:
    paths:
      - 'app-icon.svg'
      - '.github/workflows/icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Create colorful iOS icon
        run: python -c "import cairosvg; cairosvg.svg2png(url='app-icon.svg',write_to='app-touch-icon.png',output_width=512,output_height=512)"
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Build colorful iOS app icon"
            git push
          fi
